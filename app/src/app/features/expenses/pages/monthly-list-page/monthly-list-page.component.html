<main class="page">
  <header class="page-header">
    <h1>経費一覧</h1>
    <app-theme-toggle />
  </header>

  <app-section-card>
    <app-month-switcher
      [currentMonth]="currentMonth"
      (previous)="previousMonth()"
      (next)="nextMonth()"
    />
  </app-section-card>

  <app-section-card>
    <app-search-box (queryChange)="query = $event" />
    <button type="button" (click)="exportCsv()">CSV出力</button>
  </app-section-card>

  <p *ngIf="notice">{{ notice }}</p>

  <div class="list">
    @for (expense of filteredExpenses; track expense.id) {
      <div class="list-item" [attr.data-testid]="'expense-item-' + expense.id">
        <app-expense-card [expense]="expense" />
        <div class="actions">
          <button type="button" (click)="edit(expense.id)">編集</button>
          <button type="button" (click)="remove(expense.id)">削除</button>
        </div>
      </div>
    }

    @if (filteredExpenses.length === 0) {
      <p>該当データなし</p>
    }
  </div>

  <app-bottom-nav />
</main>
